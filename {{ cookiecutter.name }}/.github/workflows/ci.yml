name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image-build-affected: ${{ steps.image-build-affected.outputs.result }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Check whether the pull request can affect the image build
        id: image-build-affected
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed=$(gh api --paginate "/repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if grep -qxE 'Dockerfile|uv\.lock|pyproject\.toml|\.dockerignore' <<< "$changed"; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      - name: setup project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: lint
        run: make lint

      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@v3.1.0

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.2-alpine
        env:
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2.3-alpine
        ports:
          - 6379:6379

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: install locale stuff
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: locales-all gettext
          version: 1

      - name: test
        env:
          DATABASE_URL: postgres://postgres:secret@localhost:5432/postgres
        run: make test

  build-docker-image:
    needs: [lint, test]
    if: github.event_name != 'pull_request' || needs.lint.outputs.image-build-affected == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup project
        id: setup-project
        uses: ./.github/actions/setup-project

      - name: setup qemu
        uses: docker/setup-qemu-action@v3

      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image identifier
        id: image-identifier
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository_owner }}

      - name: Build web backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          tags: |
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-backend:latest
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-backend:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ steps.setup-project.outputs.python-version }}
            RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          tags: |
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-worker:latest
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-worker:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ steps.setup-project.outputs.python-version }}
            RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web scheduler image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: scheduler
          push: false
          tags: |
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-scheduler:latest
            ghcr.io/${{ steps.image-identifier.outputs.lowercase }}-scheduler:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ steps.setup-project.outputs.python-version }}
            RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
